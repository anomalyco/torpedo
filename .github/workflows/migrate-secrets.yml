name: migrate-secrets

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/torpedo-release
          aws-region: us-east-1

      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          parse-json-secrets: false
          secret-ids: |
            AUR_KEY,shared/AUR_SSH_KEY

      - name: check AUR_KEY
        run: |
          set -euo pipefail
          test -n "$AUR_KEY" && echo "AUR_KEY ok"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keygen -y -f "$HOME/.ssh/aur" | ssh-keygen -lf - | awk '{print "fingerprint " $2}'
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -T -i "$HOME/.ssh/aur" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes aur@aur.archlinux.org help
